<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Software Engineering — OrA Tech Studio</title>
    <meta name="description" content="Software Engineering projects by OrA Tech Studio." />
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="container">
        <header>
            <a class="brand" href="index.html">
                <div class="logo">OTS</div>
                <div>
                    <div style="font-weight:800">OrA Tech Studio</div>
                    <div class="small">Software • Music • Games • AI</div>
                </div>
            </a>
            <nav>
                <a href="index.html">Home</a>
                <a href="contact.html">Contact</a>
            </nav>
        </header>

        <main>
            <h2>Software Engineering</h2>
            <p class="muted">Check out my code and projects on the platforms below:</p>

            <div id="linksContainer" style="margin-top:24px"></div>

            <p style="margin-top:18px"><a href="index.html" class="btn ghost">← Back</a></p>
        </main>
    </div>

    <script>
        // Load and display external links for this category
        function getLinks() {
            const stored = localStorage.getItem('externalLinks');
            return stored ? JSON.parse(stored) : [];
        }

        function renderLinks() {
            const allLinks = getLinks();
            const categoryLinks = allLinks.filter(link => link.category === 'software');
            const container = document.getElementById('linksContainer');
            
            if (categoryLinks.length === 0) {
                container.innerHTML = '<div class="card"><p class="muted">No external links added yet. Check back soon!</p></div>';
                return;
            }
            
            container.innerHTML = categoryLinks.map(link => `
                <div class="card" style="margin-bottom:16px">
                    <h3 style="margin:0 0 8px 0">${escapeHtml(link.title)}</h3>
                    ${link.description ? `<p class="muted" style="margin:0 0 12px 0">${escapeHtml(link.description)}</p>` : ''}
                    <a href="${link.url}" target="_blank" rel="noopener noreferrer" class="btn">
                        View Project →
                    </a>
                </div>
            `).join('');
        }

        function escapeHtml(s){
            if (!s) return '';
            return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
        }

        // Render on page load
        renderLinks();
    </script>
</body>
</html>
