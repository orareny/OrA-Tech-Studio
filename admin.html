<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin Dashboard — OrA Tech Studio</title>
    <link rel="stylesheet" href="main.css">
    <style>
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .project-form {
            display: grid;
            gap: 12px;
            margin-bottom: 32px;
            padding: 20px;
            background: var(--card);
            border-radius: 12px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        @media (max-width: 640px) {
            .form-row { grid-template-columns: 1fr; }
        }
        .project-item {
            padding: 16px;
            background: var(--glass);
            border-radius: 10px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .project-actions {
            display: flex;
            gap: 8px;
        }
        .btn-small {
            padding: 6px 12px;
            font-size: 13px;
        }
        .btn-danger {
            background: #ff6b6b;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <main>
            <div class="admin-header">
                <div>
                    <h2 style="margin:0">Site Updates Manager</h2>
                    <p class="muted" style="margin:4px 0 0 0">Manage site news and external project links</p>
                </div>
                <div style="display:flex;gap:8px;align-items:center">
                    <button class="btn ghost btn-small" onclick="changePassword()">🔑 Change Password</button>
                    <button class="btn ghost" id="logoutBtn">Logout</button>
                </div>
            </div>

            <!-- Site Updates Section (enlarged) -->
            <div class="card">
                <h3 style="margin:0 0 12px 0">Site Updates</h3>
                <p class="muted" style="margin:0 0 16px 0">Post news, project releases, and status updates for your homepage</p>
                <form id="updateForm" style="margin-bottom:18px">
                    <input type="hidden" id="updateId">
                    <div style="display:flex;gap:8px;flex-wrap:wrap">
                        <input type="text" id="updateTitle" placeholder="Update title (e.g. New game demo live on itch.io)" style="flex:1;min-width:200px" required />
                        <select id="updateStatus" style="width:160px">
                            <option value="published">Published</option>
                            <option value="draft">Draft</option>
                        </select>
                    </div>
                    <div style="margin-top:8px">
                        <textarea id="updateBody" placeholder="Short description (e.g., 'New 2D platformer now available for testing')" rows="4" style="width:100%"></textarea>
                    </div>
                    <div style="display:flex;gap:8px;margin-top:8px">
                        <button class="btn" type="submit" id="addUpdateBtn">Add Update</button>
                        <button class="btn ghost" type="button" id="cancelUpdateBtn" style="display:none">Cancel</button>
                    </div>
                </form>

                <h4 style="margin:12px 0 8px 0">All Updates</h4>
                <div id="updatesList"></div>
            </div>

            <!-- External Links Manager (for topic pages) -->
            <div class="card" style="margin-top:24px">
                <h3 style="margin:0 0 12px 0">External Project Links</h3>
                <p class="muted" style="margin:0 0 16px 0">Add links to your external portfolios (itch.io, GitHub, SoundCloud, etc.)</p>
                <form id="linkForm" class="project-form" style="margin-bottom:18px;padding:16px">
                    <input type="hidden" id="linkId">
                    <div class="form-row">
                        <div>
                            <label class="small" for="linkTitle">Link Title*</label>
                            <input type="text" id="linkTitle" placeholder="e.g., My Games on itch.io" required>
                        </div>
                        <div>
                            <label class="small" for="linkCategory">Category*</label>
                            <select id="linkCategory" required>
                                <option value="">Select category</option>
                                <option value="software">Software Engineering</option>
                                <option value="music">Music Production</option>
                                <option value="games">Game Development</option>
                                <option value="ai">AI & ML</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div>
                            <label class="small" for="linkUrl">URL*</label>
                            <input type="url" id="linkUrl" placeholder="https://username.itch.io" required>
                        </div>
                        <div>
                            <label class="small" for="linkDescription">Short Description</label>
                            <input type="text" id="linkDescription" placeholder="e.g., Collection of indie games">
                        </div>
                    </div>
                    <div style="display:flex;gap:10px">
                        <button class="btn" type="submit" id="submitLinkBtn">Add Link</button>
                        <button class="btn ghost" type="button" id="cancelLinkBtn" style="display:none">Cancel</button>
                    </div>
                </form>

                <h4 style="margin:12px 0 8px 0">All External Links (<span id="linkCount">0</span>)</h4>
                <div id="linksList"></div>
            </div>

            <p style="margin-top:20px"><a href="index.html" class="btn ghost">← Back to site</a></p>
        </main>
    </div>

    <script src="Scripts/admin.js"></script>
</body>
</html>
